[package]
name = "wsmr"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
zbus = "5.19.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
