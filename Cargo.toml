[package]
name = "wsmr"
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive", "env"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zbus = "6.5.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
