<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1000" height="880" fill="#ffffff"/>
  <defs>
    <filter id="kc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="kc-rose" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L8,4.5 L0,8.5 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="500" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">kmscon vs. Hyprland: the seat/DRM ownership flapping loop</text>

  <!-- circular flow: N -> E -> S -> W -> N, uniform 260x70 boxes -->
  <path d="M615,105 Q637,140 580,250" fill="none" stroke="#e11d48" stroke-width="2.25" marker-end="url(#kc-rose)"/>
  <path d="M580,285 Q634,404 610,445" fill="none" stroke="#e11d48" stroke-width="2.25" marker-end="url(#kc-rose)"/>
  <path d="M390,445 Q366,404 420,285" fill="none" stroke="#e11d48" stroke-width="2.25" marker-end="url(#kc-rose)"/>
  <path d="M420,255 Q366,136 390,95" fill="none" stroke="#e11d48" stroke-width="2.25" marker-end="url(#kc-rose)"/>

  <text x="500" y="260" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">flapping loop</text>
  <text x="500" y="272" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">(dozens of cycles,</text>
  <text x="500" y="284" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">whole session)</text>

  <!-- N -->
  <rect x="370" y="45" width="260" height="70" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="500" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">[libseat] Disabling seat</text>
  <text x="500" y="93" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9f1239">kmscon reclaims the VT + DRM master</text>

  <!-- E -->
  <rect x="560" y="235" width="260" height="70" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="690" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">all input devices removed</text>
  <text x="690" y="283" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9f1239">from Hyprland's seat</text>

  <!-- S -->
  <rect x="370" y="425" width="260" height="70" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="500" y="454" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">[libseat] Enabling seat</text>
  <text x="500" y="473" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9f1239">Hyprland regains the VT + DRM master</text>

  <!-- W -->
  <rect x="180" y="235" width="260" height="70" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="310" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">all input devices re-added</text>
  <text x="310" y="283" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9f1239">to Hyprland's seat</text>

  <!-- symptom -->
  <rect x="50" y="545" width="900" height="60" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#kc-shadow)"/>
  <text x="500" y="570" text-anchor="middle" font-size="12" fill="#0f172a">Symptom: input devices enumerate correctly at first (not a permissions/ACL problem) —</text>
  <text x="500" y="589" text-anchor="middle" font-size="12" fill="#0f172a">but mouse and keyboard are then completely unresponsive for the session's whole lifetime.</text>

  <!-- fix -->
  <rect x="50" y="625" width="900" height="92" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="500" y="650" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Workaround (verified working)</text>
  <text x="500" y="670" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="11.5" fill="#065f46">systemctl start getty@ttyN.service   (on an unused VT, before switching to it)</text>
  <text x="500" y="689" text-anchor="middle" font-size="11.5" fill="#047857">logind then finds a console already present on that VT and never spawns kmsconvt@ttyN —</text>
  <text x="500" y="706" text-anchor="middle" font-size="11.5" fill="#047857">TERM_SESSION_TYPE never becomes "kms", so the conflict never triggers at all.</text>

  <!-- cross validation -->
  <rect x="50" y="733" width="900" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.75" filter="url(#kc-shadow)"/>
  <text x="500" y="757" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Cross-validated against real uwsm 0.26.7 — not wsmr-specific</text>
  <text x="500" y="777" text-anchor="middle" font-size="11.5" fill="#075985">Same host, same conflict, but harder: Hyprland aborts outright (SIGABRT in CBackend::create())</text>
  <text x="500" y="795" text-anchor="middle" font-size="11.5" fill="#075985">instead of degrading. Confirms a kmscon &lt;-&gt; Hyprland/aquamarine interop issue, not wsmr's own</text>
  <text x="500" y="813" text-anchor="middle" font-size="11.5" fill="#075985">kmscon hand-off code (verified byte-identical to upstream's signal-handler.sh).</text>
</svg>
