# CI for justfile-rust baseline. Source of truth: delfianto/ci-rust + JUST.md
# Gates: format --check-only · lint · cargo build --all-targets · test · MSRV

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Optional — only for crates that need native libs at build time:
      # - name: System build dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y <packages>

      - name: format
        run: just format --check-only

      - name: lint
        run: just lint

      - name: build
        run: cargo build --all-targets --verbose

      - name: test
        run: just test

  tier-b:
    name: tier-b (systemd-as-PID-1 integration, informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run Tier-B integration smoke
        run: bash scripts/linux-integration.sh

  msrv:
    name: msrv (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Single source of truth: read the floor from Cargo.toml itself rather
      # than duplicating the version number in this workflow, so the two
      # can't silently drift apart.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: build (pinned to MSRV, locked dependency graph)
        run: cargo build --all-targets --locked --verbose

      - name: test (pinned to MSRV, locked dependency graph)
        run: cargo test --all-targets --locked
