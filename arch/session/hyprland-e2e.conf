# Minimal, isolated Hyprland config for wsmr's disposable-user E2E test
# harness: does not invoke the existing /usr/bin/uwsm wrapper and does not
# inherit the primary user's configuration.
#
# Copy this file to the disposable test user's own
# $HOME/.config/hypr/hyprland.conf — do not symlink or `source` the primary
# user's config from here; the whole point is that this account's session
# has nothing in common with the daily-driver one.
#
# This is a reasonable starting point, not a config verified against real
# hardware: exact monitor/output syntax is machine-specific. Adjust the
# `monitor` line for your actual output(s) before the first real run, and
# expect to iterate once you can see `hyprctl monitors` output.

monitor = , preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
}

# So a real interactive login/logout cycle can exit through wsmr's own stop
# path instead of a forced kill from another TTY every time.
bind = SUPER, Q, exit
